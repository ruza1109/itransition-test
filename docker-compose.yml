services:
  mysql:
    image: mysql:8.0
    environment:
#      MYSQL_DATABASE: itransition
      MYSQL_USER: developer
      MYSQL_PASSWORD: developer
      MYSQL_ROOT_PASSWORD: developer
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - itransition_network

  app:
    build: .
    volumes:
      - ./src:/var/www/html
    networks:
      - itransition_network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    networks:
      - itransition_network
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

networks:
  itransition_network:
    driver: bridge